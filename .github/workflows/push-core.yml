name: push_core

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test -p push_core
        run: cargo test -p push_core
      - name: cargo test -p push_sim
        run: cargo test -p push_sim
