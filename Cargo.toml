[workspace]
resolver = "2"
members = [
    "push_core",
    "push_wasm",
    "push_sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["PushSimulator"]

[workspace.dependencies]
push_core = { path = "push_core" }
rand = "0.8"
rayon = "1.10"
csv = "1.3"
wasm-bindgen = "0.2"
